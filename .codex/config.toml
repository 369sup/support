# Project-scoped Codex configuration.
#
# Codex loads this layer only when the repository is trusted. Keep personal
# preferences and credentials in ~/.codex.

[agents.reviewer]
config_file = "agents/reviewer.toml"
description = "Review changes for correctness, security, architecture, and regression risks."

# ------------------------------------------------------------
# Context7
# Retrieves current library and framework documentation.
# ------------------------------------------------------------

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

enabled = true
required = false

startup_timeout_sec = 20
tool_timeout_sec = 120
env_http_headers = {
  CONTEXT7_API_KEY = "CONTEXT7_API_KEY"
}


# ------------------------------------------------------------
# Mermaid
# Validates and renders Mermaid diagrams embedded in Markdown.
# ------------------------------------------------------------

[mcp_servers.mermaid]
url = "https://mcp.mermaid.ai/mcp"

enabled = true
required = false

startup_timeout_sec = 20
tool_timeout_sec = 120
